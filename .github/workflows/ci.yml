name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    # tests/globalSetup.ts creates its own "alta_test" database on this
    # instance and migrates it — the test suite needs a live Postgres to
    # connect to, not a mock. Redis is equally real: the ingest queue tests
    # exercise BullMQ against it rather than stubbing the queue.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alta
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: alta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://alta:devpassword@localhost:5432/alta
      REDIS_URL: redis://localhost:6379
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: alta-minio
      S3_SECRET_KEY: alta-minio-devsecret
      S3_BUCKET: alta-files
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Service containers can't override the image command, and minio/minio
      # needs `server /data` — so MinIO runs as a plain docker step instead.
      # The storage tests do real presigned PUT/GET roundtrips against it;
      # presigned URLs never exercised against a real S3 are guesses.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=alta-minio -e MINIO_ROOT_PASSWORD=alta-minio-devsecret \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break || sleep 1
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate --workspace apps/api

      - name: Typecheck apps/api
        run: npm run typecheck --workspace apps/api

      - name: Typecheck apps/dashboard
        run: npm run typecheck --workspace apps/dashboard

      - name: Build apps/api
        run: npm run build --workspace apps/api

      - name: Build apps/dashboard
        run: npm run build --workspace apps/dashboard

      - name: Test apps/api
        run: npm test --if-present --workspace apps/api

  docker-build:
    name: Validate Docker builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build apps/api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false

      - name: Build web (dashboard + Caddy) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/web/Dockerfile
          push: false
