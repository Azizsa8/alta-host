services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-alta}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - alta-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-alta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - alta-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage (§5): fault photos, content media, policy
  # docs. Self-hosted MinIO keeps files in-region alongside the rest of
  # the data. Files are NEVER public — access is via short-lived signed
  # URLs only.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-alta-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-alta-minio-devsecret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
    volumes:
      - alta-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-alta}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-alta}
      REDIS_URL: redis://redis:6379
      PORT: 4317
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-cloud_api}
      WHATSAPP_CLOUD_API_TOKEN: ${WHATSAPP_CLOUD_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-alta-dev-verify-token}
      # WAHA is a dev/demo-only transport (see wahaGateway.ts) — the "waha"
      # service below only starts under `docker compose --profile dev up`,
      # never in a default/staging run.
      WAHA_BASE_URL: ${WAHA_BASE_URL:-http://waha:3000}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      # "mastra" routes dispatch through the workflow runtime (durable
      # suspend/resume review gate); anything else uses the legacy switch.
      ORCHESTRATOR: ${ORCHESTRATOR:-legacy}
      INGEST_CONCURRENCY: ${INGEST_CONCURRENCY:-20}
      NLU_PROVIDER: ${NLU_PROVIDER:-rule_based}
      ASR_PROVIDER: ${ASR_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      PMS_PROVIDER: ${PMS_PROVIDER:-mock}
      MEWS_PLATFORM_ADDRESS: ${MEWS_PLATFORM_ADDRESS:-https://api.mews-demo.com}
      MEWS_CLIENT_TOKEN: ${MEWS_CLIENT_TOKEN:-}
      MEWS_ACCESS_TOKEN: ${MEWS_ACCESS_TOKEN:-}
      MEWS_CLIENT_NAME: ${MEWS_CLIENT_NAME:-}
      # Signs dashboard login tokens (see modules/auth/tokens.ts) — falls
      # back to an insecure hardcoded dev value with a warning logged if
      # unset. Set a real random value for anything beyond local dev.
      JWT_SECRET: ${JWT_SECRET:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-alta-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-alta-minio-devsecret}
      S3_BUCKET: ${S3_BUCKET:-alta-files}
      # Signed download/upload URLs are minted against this origin — must
      # be reachable by the BROWSER, not just by containers.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      AUTO_APPROVE_INTENTS: ${AUTO_APPROVE_INTENTS:-}
    expose:
      - "4317"

  # Self-hosted WAHA (WhatsApp HTTP API) — dev/demo transport only, see
  # wahaGateway.ts for why this must never carry real guest traffic. Only
  # starts with `docker compose --profile dev up`; excluded from a default
  # or staging run.
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    profiles: ["dev"]
    depends_on:
      - api
    environment:
      WHATSAPP_HOOK_URL: http://api:4317/webhook/waha?propertyId=${WAHA_PROPERTY_ID:-demo-property}
      WHATSAPP_HOOK_EVENTS: message
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      # NOWEB talks the WhatsApp multi-device protocol directly instead of
      # driving a real browser via whatsapp-web.js (the WEBJS default) —
      # avoids WEBJS breaking every time WhatsApp Web's internal JS changes.
      WHATSAPP_DEFAULT_ENGINE: NOWEB
    ports:
      - "${WAHA_PORT:-3210}:3000"
    # WAHA keeps the paired WhatsApp session on disk. Without this volume it
    # lives only in the container's writable layer, so ANY recreate (an image
    # pull, a compose edit) silently unpairs the phone and demands a fresh QR
    # scan — discovered the hard way during a live owner test.
    volumes:
      - waha-sessions:/app/.sessions

  web:
    build:
      context: .
      dockerfile: infra/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://:80}
    ports:
      - "${WEB_PORT:-8080}:80"
      - "${WEB_TLS_PORT:-8443}:443"

volumes:
  waha-sessions:
  alta-db-data:
  alta-redis-data:
  alta-minio-data:
